name: Refresh TrackWerk canonical release links
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trackwerk-website
  cancel-in-progress: false
jobs:
  canonical:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore reviewed public text-only migration helpers
        env:
          REVIEW_DIR: ${{ runner.temp }}/trackwerk-canonical
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,json,os,zlib
          raw=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='05d6f9e6e894ccbe233c82e12607970dca5c965d5637bdca85ad96ad572b95f7'
          target=Path(os.environ['REVIEW_DIR']);target.mkdir()
          for name,text in json.loads(raw).items():
              assert '/' not in name and name.endswith(('.py','.json'))
              (target/name).write_text(text)
          print('Reviewed public release helpers restored; no private files or credentials embedded')
          PYTHON
      - name: Verify and refresh release documentation and canonical source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/trackwerk-canonical/publish_canonical_assets.py"
      - name: Commit canonical source and verified public metadata
        run: |
          git config user.name "Kid Bunka"
          git config user.email "338288444+kidbee85-beep@users.noreply.github.com"
          git add source brand-authoring font-authoring build-tools release-tools BUILD-TRACKWERK-0.9.txt PUBLIC-PRODUCTION-SOURCE-FREEZE.json SOURCE-FILES.json docs/site PUBLICATION-MANIFEST.json PUBLIC-RELEASE-MANIFEST.json TRACKWERK-URL-MIGRATION-RECEIPT.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete TrackWerk canonical links and distribution branding"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site
      - name: Publish the final canonical website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
