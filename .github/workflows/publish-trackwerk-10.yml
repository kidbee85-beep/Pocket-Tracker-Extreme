          TrackWerk is distributed under GPL-3.0-or-later. See the [build instructions](BUILD-TRACKWERK.txt) and [application source](source/). The release includes the matching source ZIP, component licenses and exact Miyoo SDL source. Selected DSP work is based on open Mutable Instruments code by Emilie Gillet and contributors. See the [credits and licenses](https://kidbee85-beep.github.io/TrackWerk/credits.html).
          TRACKWERK_10_README
          printf 'MANIFEST=%s\nPUBLISHER=%s\nREVIEWED_README=%s\n' "$review/manifest.json" "$review/publisher.py" "$review/README.md" >> "$GITHUB_ENV"
      - name: Read and verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/trackwerk-10"
          python3 "$PUBLISHER" fetch \
            --manifest "$MANIFEST" --expected-sha256 "$APPROVED_SHA256" \
            --downloads "$RUNNER_TEMP/trackwerk-10"
      - name: Verify corresponding source and prepare canonical website
        run: |
          set -euo pipefail
          python3 "$PUBLISHER" prepare --manifest "$MANIFEST" \
            --downloads "$RUNNER_TEMP/trackwerk-10" --repository . --readme "$REVIEWED_README"
      - name: Commit approved source and site and create the release tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add -A
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
            git merge-base --is-ancestor "$commit" HEAD
            git diff --cached --quiet "$commit" --
            git diff --cached --quiet --
            echo "Existing tag matches the complete approved tree. Its ref will be reused."
          else
            python3 "$PUBLISHER" require-draft --downloads "$RUNNER_TEMP/trackwerk-10"
            git config user.name "Kid Bunka"
            git config user.email "338288444+kidbee85-beep@users.noreply.github.com"
            if ! git diff --cached --quiet; then
              git commit -m "Publish TrackWerk 1.0 corresponding source and website"
            fi
            commit="$(git rev-parse HEAD)"
            git tag -a "$TAG" "$commit" -m "TrackWerk 1.0"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Publish the stable release and verify public readback
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -euo pipefail
          # The release API's target is ignored when the tag already exists.
          # Verify the public tag is this approved commit before opening the draft.
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)"
          test "$remote" = "$TAG_COMMIT"
          python3 "$PUBLISHER" publish --manifest "$MANIFEST" \
            --downloads "$RUNNER_TEMP/trackwerk-10" --commit "$TAG_COMMIT"
          printf '\nRun the existing **Publish approved website** workflow on main to deploy docs/site.\n' >> "$GITHUB_STEP_SUMMARY"
