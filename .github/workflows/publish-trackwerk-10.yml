name: Publish approved TrackWerk 1.0

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of the reviewed release manifest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: trackwerk-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kidbee85-beep/TrackWerk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Restore reviewed release files
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/trackwerk-10-review"
          mkdir "$review"
          cat > "$review/publisher.py" <<'TRACKWERK_10_SCRIPT'
          """Verify TrackWerk 1.0 release bytes and mirror the approved canonical tree."""
          
          import argparse
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import subprocess
          import tarfile
          import tempfile
          import time
          import urllib.request
          import zipfile
          
          
          REPO = "kidbee85-beep/TrackWerk"
          TAG = "v1.0.0"
          SOURCE_MANIFEST = "SOURCE-FILES.json"
          SOURCE_DIRS = {"source", "android-overlay", "brand-authoring", "build-tools", "font-authoring", "release-tools"}
          SOURCE_DOCS = {SOURCE_MANIFEST, "SOURCE-SNAPSHOT.json", "PUBLIC-PRODUCTION-SOURCE-FREEZE.json", "BUILD-TRACKWERK.txt", "README.md"}
          SITE_DIRS = {"assets", "data", "licenses", "community"}
          SITE_FILES = {".nojekyll", "robots.txt", "sitemap.xml"}
          SITE_DOWNLOADS = {"android", "brick-first", "brick-update", "mini", "plus", "miyoo-update",
                            "rgb20s", "rgb20s-update", "presets", "source", "sdl-source", "checksums"}
          APPROVED_README = Path(".github/release/README-TRACKWERK-1.0.md")
          ASSET = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,159}\Z")
          HASH = re.compile(r"[0-9a-f]{64}\Z")
          COMMIT = re.compile(r"[0-9a-f]{40}\Z")
          BUILD_DOC = re.compile(r"BUILD-TRACKWERK-[A-Z0-9.]+\.txt\Z")
          PRIVATE_NAMES = {".git", ".ds_store", "__macosx", ".env", "local.properties", "private", "not-for-public"}
          PRIVATE_SUFFIXES = {".jks", ".keystore", ".p12", ".pfx", ".apk", ".ptp"}
          
          
          def require(value, message):
              if not value:
                  raise ValueError(message)
          
          
          def read_json(path):
              return json.loads(path.read_text())
          
          
          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n")
          
          
          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          
          
          def reviewed_file(path, entry):
              require(path.is_file() and not path.is_symlink(), f"Missing reviewed file: {path.name}")
              require(path.stat().st_size == entry["bytes"] and sha(path) == entry["sha256"],
                      f"Size or SHA-256 mismatch: {path.name}")
          
          
          def is_public_name(name):
              lower = name.lower()
              return ASSET.fullmatch(name) and "private" not in lower and not re.search(r"(?:^|[-_.])dev(?:[-_.]|\d|$)", lower)
          
          
          def manifest(path):
              value = read_json(path)
              require(value["repository"] == REPO and value["tag"] == TAG, "Wrong repository or tag")
              require(value["version"] == 1, "Unsupported manifest version")
              for name, asset in value["assets"].items():
                  require(is_public_name(name), f"Invalid public asset name: {name}")
                  require(type(asset["bytes"]) is int and asset["bytes"] > 0 and HASH.fullmatch(asset["sha256"]),
                          f"Invalid reviewed asset record: {name}")
              for role in ("source", "website"):
                  entry = value[role]
                  require(entry["file"] in value["assets"] and ASSET.fullmatch(entry["root"]), f"Invalid {role} bundle")
              require(value["source"]["file"] != value["website"]["file"], "Source and website must be separate bundles")
              require(HASH.fullmatch(value["source"]["manifest_sha256"]), "Invalid SOURCE-FILES.json digest")
              if "readme_sha256" in value:
                  require(HASH.fullmatch(value["readme_sha256"]), "Invalid README digest")
              return value
          
          
          def safe_parts(name):
              path = PurePosixPath(name)
              require(name and "\\" not in name and not path.is_absolute() and ".." not in path.parts,
                      f"Unsafe archive member: {name!r}")
              require(path.parts and path.as_posix() == name.rstrip("/"), f"Noncanonical archive member: {name!r}")
              for part in path.parts:
                  require(part.lower() not in PRIVATE_NAMES and not part.lower().startswith(("private-", ".env.")),
                          f"Private or local path in publication bundle: {name!r}")
                  require(PurePosixPath(part).suffix.lower() not in PRIVATE_SUFFIXES,
                          f"Private or built asset in publication bundle: {name!r}")
              return path.parts
          
          
          def entries(path, destination, bundle_root):
              require(ASSET.fullmatch(bundle_root), "Archive root must be a single directory name")
              seen = set()
          
              def target(name, directory):
                  parts = safe_parts(name)
                  require(parts[0] == bundle_root and (directory or len(parts) > 1), f"Unexpected archive root: {name!r}")
                  require(parts not in seen, f"Duplicate archive member: {name!r}")
                  seen.add(parts)
                  return destination.joinpath(*parts)
          
              if zipfile.is_zipfile(path):
                  with zipfile.ZipFile(path) as archive:
                      for item in archive.infolist():
                          mode = item.external_attr >> 16
                          kind = stat.S_IFMT(mode)
                          require(kind in (0, stat.S_IFREG, stat.S_IFDIR), f"Nonregular ZIP member: {item.filename}")
                          out = target(item.filename, item.is_dir())
                          if item.is_dir():
                              out.mkdir(parents=True, exist_ok=True)
                          else:
                              out.parent.mkdir(parents=True, exist_ok=True)
                              with archive.open(item) as source, out.open("xb") as output:
                                  shutil.copyfileobj(source, output)
                              out.chmod(0o755 if mode & 0o111 else 0o644)
              else:
                  with tarfile.open(path, "r:gz") as archive:
                      for item in archive:
                          require(item.isfile() or item.isdir(), f"Nonregular tar member: {item.name}")
                          out = target(item.name, item.isdir())
                          if item.isdir():
                              out.mkdir(parents=True, exist_ok=True)
                          else:
                              out.parent.mkdir(parents=True, exist_ok=True)
                              with archive.extractfile(item) as source, out.open("xb") as output:
                                  shutil.copyfileobj(source, output)
                              out.chmod(0o755 if item.mode & 0o111 else 0o644)
              bundle = destination / bundle_root
              require(bundle.is_dir(), f"Missing archive root: {bundle_root}")
              return bundle
          
          
          def source_tree(bundle, expected):
              source_manifest = bundle / SOURCE_MANIFEST
              require(source_manifest.is_file() and sha(source_manifest) == expected, "SOURCE-FILES.json digest mismatch")
              paths = set()
              metadata = read_json(source_manifest)
              require(metadata["version"] == "1.0.0", "Corresponding source manifest is not 1.0.0")
              for item in metadata["files"]:
                  name = item["path"]
                  require(name != SOURCE_MANIFEST and name not in paths, f"Duplicate or self-referencing source path: {name}")
                  path = bundle.joinpath(*safe_parts(name))
                  reviewed_file(path, item)
                  paths.add(name)
              found = {p.relative_to(bundle).as_posix() for p in bundle.rglob("*") if p.is_file()}
              require(found == paths | {SOURCE_MANIFEST}, "Archive and SOURCE-FILES.json enumerate different source files")
              require((bundle / "source").is_dir() and (bundle / "source/LICENSE").is_file(), "Corresponding source or license missing")
              for child in bundle.iterdir():
                  permitted = child.name in SOURCE_DIRS if child.is_dir() else child.name in SOURCE_DOCS or BUILD_DOC.fullmatch(child.name)
                  require(permitted, f"Unexpected top-level source entry: {child.name}")
              return len(paths)
          
          
          def website_tree(site, expected):
              require((site / "index.html").is_file() and (site / ".nojekyll").is_file(), "Static website entry point missing")
              for child in site.iterdir():
                  permitted = child.name in SITE_DIRS if child.is_dir() else child.name in SITE_FILES or child.suffix == ".html"
                  require(permitted, f"Unexpected top-level site entry: {child.name}")
              meta = read_json(site / "data/releases.json")
              require(meta["tag"] == TAG and meta["repository"] == "https://github.com/" + REPO and meta["releaseReady"] is True,
                      "Website release metadata is not final for TrackWerk 1.0")
              require(set(meta["assets"]) == SITE_DOWNLOADS, "Website download set is not the approved platform matrix")
              linked = set()
              for key, item in meta["assets"].items():
                  name = item["file"]
                  require(name in expected["assets"] and name not in linked and item["ready"] is True,
                          f"Unexpected or duplicate public download: {key}")
                  require(all(item[field] == expected["assets"][name][field] for field in ("bytes", "sha256")),
                          f"Website download record differs from approved asset: {name}")
                  linked.add(name)
              require(meta["assets"]["source"]["file"] == expected["source"]["file"], "Website points to different source")
              require(expected["website"]["file"] not in linked, "Website archive checksum cannot describe itself")
              return linked
          
          
          def replace(destination, origin):
              require(not destination.is_symlink(), f"Refusing to replace symlink: {destination}")
              if destination.is_dir():
                  shutil.rmtree(destination)
              elif destination.exists():
                  destination.unlink()
              if origin.is_dir():
                  shutil.copytree(origin, destination)
              else:
                  shutil.copy2(origin, destination)
          
          
          def prepare(args):
              reviewed = manifest(args.manifest)
              for name, item in reviewed["assets"].items():
                  reviewed_file(args.downloads / name, item)
              repo = args.repository.resolve()
              require((repo / ".git").exists(), "Expected a Git checkout")
              require(not (repo / "docs").is_symlink(), "Unexpected docs symlink")
              if "readme_sha256" in reviewed:
                  readme = args.readme or repo / APPROVED_README
                  require(readme.is_file() and not readme.is_symlink() and sha(readme) == reviewed["readme_sha256"],
                          "Canonical README differs from approved README")
              with tempfile.TemporaryDirectory() as directory:
                  scratch = Path(directory)
                  source = reviewed["source"]
                  website = reviewed["website"]
                  bundle = entries(args.downloads / source["file"], scratch / "source", source["root"])
                  site = entries(args.downloads / website["file"], scratch / "site", website["root"])
                  count = source_tree(bundle, source["manifest_sha256"])
                  linked = website_tree(site, reviewed)
                  # Validate both trees before copying either. Preserve repository workflows, history and unrelated files.
                  source_paths = sorted(child.name for child in bundle.iterdir())
                  for child in bundle.iterdir():
                      replace(repo / child.name, child)
                  for stale in (repo / "BUILD-TRACKWERK-0.9.txt",):
                      if stale.is_file():
                          stale.unlink()
                  if "readme_sha256" in reviewed:
                      replace(repo / "README.md", readme)
                  (repo / "docs").mkdir(exist_ok=True)
                  replace(repo / "docs/site", site)
                  write_json(repo / "PUBLICATION-MANIFEST.json", reviewed)
                  # These paths were verified byte-for-byte. Include even source files
                  # matched by upstream's own ignore patterns.
                  subprocess.run(["git", "add", "--force", "--", *source_paths, "docs/site"], cwd=repo, check=True)
              print(f"Verified and staged {count} source files and {len(linked)} website download links.")
          
          
          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True, stdout=subprocess.PIPE).stdout
          
          
          def matching_release():
              pages = json.loads(gh("--paginate", "--slurp", f"repos/{REPO}/releases?per_page=100"))
              matches = [release for page in pages for release in page if release["tag_name"] == TAG]
              require(len(matches) == 1, f"Expected exactly one reviewed draft or release for {TAG}")
              return matches[0]
          
          
          def matching_assets(release, expected):
              require(release["tag_name"] == TAG, "Wrong release tag")
              listed = release["assets"]
              actual = {asset["name"]: asset for asset in listed}
              require(len(actual) == len(listed) and actual.keys() == expected["assets"].keys(),
                      "GitHub release asset names differ from the approved manifest")
              for name, item in expected["assets"].items():
                  asset = actual[name]
                  require(asset["size"] == item["bytes"] and asset["state"] == "uploaded",
                          f"Wrong size or upload state: {name}")
                  if asset.get("digest"):
                      require(asset["digest"] == "sha256:" + item["sha256"], f"GitHub asset digest differs: {name}")
              return actual
          
          
          def snapshot(path):
              return read_json(path / ".release-snapshot.json")
          
          
          def fetch(args):
              require(HASH.fullmatch(args.expected_sha256) and sha(args.manifest) == args.expected_sha256,
                      "Dispatch SHA-256 does not match the reviewed manifest")
              reviewed = manifest(args.manifest)
              release = matching_release()
              assets = matching_assets(release, reviewed)
              require(release["draft"] or not release["prerelease"], "Existing release is not stable")
              for name, item in reviewed["assets"].items():
                  path = args.downloads / name
                  asset_id = int(assets[name]["id"])
                  with path.open("xb") as output:
                      subprocess.run(["gh", "api", "-H", "Accept: application/octet-stream",
                                      f"repos/{REPO}/releases/assets/{asset_id}"], check=True, stdout=output)
                  reviewed_file(path, item)
              write_json(args.downloads / ".release-snapshot.json",
                         {"id": release["id"], "draft": release["draft"],
                          "assets": {name: value["id"] for name, value in assets.items()}})
              print(f"Downloaded and verified {len(assets)} release assets.")
          
          
          def public_release():
              url = f"https://api.github.com/repos/{REPO}/releases/tags/{TAG}"
              request = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json",
                                                            "User-Agent": "TrackWerk-release-verifier"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          
          
          def verify_public(expected, before):
              for attempt in range(6):
                  try:
                      result = public_release()
                      break
                  except OSError:
                      if attempt == 5:
                          raise
                      time.sleep(2 ** attempt)
              require(result["id"] == before["id"] and result["draft"] is False and result["prerelease"] is False,
                      "Public API did not return the verified stable release")
              readback = matching_assets(result, expected)
              require({name: value["id"] for name, value in readback.items()} == before["assets"],
                      "Release assets changed during publication")
              print(f"Verified public release {result['html_url']} with {len(readback)} approved assets.")
          
          
          def publish(args):
              require(COMMIT.fullmatch(args.commit), "Expected the validated tag commit")
              reviewed = manifest(args.manifest)
              before = snapshot(args.downloads)
              release = json.loads(gh(f"repos/{REPO}/releases/{int(before['id'])}"))
              current = matching_assets(release, reviewed)
              require({name: value["id"] for name, value in current.items()} == before["assets"],
                      "Draft assets changed after download")
              if release["draft"]:
                  gh("-X", "PATCH", f"repos/{REPO}/releases/{int(before['id'])}", "-F", "draft=false",
                     "-F", "prerelease=false", "-f", "target_commitish=" + args.commit, "-f", "make_latest=true")
              else:
                  require(release["prerelease"] is False, "Existing release is not stable")
              verify_public(reviewed, before)
          
          
          def record(path):
              require(path.is_file() and not path.is_symlink(), f"Invalid approved file: {path}")
              require(is_public_name(path.name), f"Invalid public asset name: {path.name}")
              return {"bytes": path.stat().st_size, "sha256": sha(path)}
          
          
          def create_manifest(args):
              with tempfile.TemporaryDirectory() as directory:
                  scratch = Path(directory)
                  source = entries(args.source, scratch / "source", args.source_root)
                  site = entries(args.website, scratch / "site", args.website_root)
                  linked = read_json(site / "data/releases.json")["assets"]
                  files = {p.name: p for p in (args.source, args.website, *args.extra)}
                  require(len(files) == 2 + len(args.extra), "Duplicate release asset name")
                  for item in linked.values():
                      name = item["file"]
                      require(is_public_name(name), f"Invalid linked filename: {name}")
                      files.setdefault(name, args.assets / name)
                  reviewed = {"version": 1, "repository": REPO, "tag": TAG,
                              "assets": {name: record(path) for name, path in files.items()},
                              "source": {"file": args.source.name, "root": args.source_root,
                                         "manifest_sha256": sha(source / SOURCE_MANIFEST)},
                              "website": {"file": args.website.name, "root": args.website_root}}
                  source_tree(source, reviewed["source"]["manifest_sha256"])
                  website_tree(site, reviewed)
                  if args.readme:
                      reviewed["readme_sha256"] = sha(args.readme)
                      readme = args.output.parent / APPROVED_README.name
                      if args.readme.resolve() != readme.resolve():
                          shutil.copy2(args.readme, readme)
                  write_json(args.output, reviewed)
              print(f"{sha(args.output)}  {args.output}")
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              commands = parser.add_subparsers(dest="mode", required=True)
              for mode in ("fetch", "prepare", "publish"):
                  command = commands.add_parser(mode)
                  command.add_argument("--manifest", type=Path, required=True)
                  command.add_argument("--downloads", type=Path, required=True)
                  if mode == "fetch":
                      command.add_argument("--expected-sha256", required=True)
                  elif mode == "prepare":
                      command.add_argument("--repository", type=Path, required=True)
                      command.add_argument("--readme", type=Path)
                  else:
                      command.add_argument("--commit", required=True)
              draft = commands.add_parser("require-draft")
              draft.add_argument("--downloads", type=Path, required=True)
              create = commands.add_parser("create-manifest")
              create.add_argument("--source", type=Path, required=True)
              create.add_argument("--source-root", required=True)
              create.add_argument("--website", type=Path, required=True)
              create.add_argument("--website-root", default="TrackWerk-1.0-Website")
              create.add_argument("--assets", type=Path, required=True)
              create.add_argument("--extra", type=Path, action="append", default=[])
              create.add_argument("--readme", type=Path)
              create.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              if args.mode == "require-draft":
                  require(snapshot(args.downloads)["draft"] is True, "Public release without a local tag cannot be repaired automatically")
              else:
                  {"fetch": fetch, "prepare": prepare, "publish": publish, "create-manifest": create_manifest}[args.mode](args)
          
          
          if __name__ == "__main__":
              main()
          TRACKWERK_10_SCRIPT
          cat > "$review/manifest.json" <<'TRACKWERK_10_MANIFEST'
          {
            "assets": {
              "SDL2-mmiyoo-f6319cf9-source.tar.gz": {
                "bytes": 17285143,
                "sha256": "b4c2416b244ad5d9c208fa5939e865331880df9fb8f9e8fca3a5d2d5017af549"
              },
              "SHA256SUMS.txt": {
                "bytes": 1160,
                "sha256": "430740e5d5e332de8579496ae36440ddd861fa5e235c585be85ae473b07b811e"
              },
              "TrackWerk-1.0-Android.apk": {
                "bytes": 34586354,
                "sha256": "9fd6c746e4e694665c58110017aefb02b924ae709f05ae93b7496b3baa912ee4"
              },
              "TrackWerk-1.0-Brick-KNULLI-First-Install.zip": {
                "bytes": 51300921,
                "sha256": "eeeec9dd64834389f2e9e3f51bd5ab14143ccf12044689fc338472dbf2de9aab"
              },
              "TrackWerk-1.0-Brick-Program-Factory-Update.zip": {
                "bytes": 5161133,
                "sha256": "bd2e64891e61ebdc471151b81cbff5ee692f917fff27c97d37b3b05dc3e349e2"
              },
              "TrackWerk-1.0-Factory-Presets.zip": {
                "bytes": 2035034,
                "sha256": "e66e2084da36b89730f9f76b5af2bee55968ee620f392bfcb8ca50553cd1d4b2"
              },
              "TrackWerk-1.0-Miyoo-Mini-Onion-First-Install.zip": {
