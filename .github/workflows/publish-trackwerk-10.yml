            },
            "readme_sha256": "49b007aca615263057dec84f1a03370e078f7a84e961cedbb37660b5a1b8434a",
            "repository": "kidbee85-beep/TrackWerk",
            "source": {
              "file": "TrackWerk-1.0-Source.zip",
              "manifest_sha256": "b90a06e73106cc3f6a23ad7103e9571a3d9afae44a786f15b6271bc01edff8f6",
              "root": "TrackWerk-1.0"
            },
            "tag": "v1.0.0",
