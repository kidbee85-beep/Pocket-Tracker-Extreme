name: Clarify public TrackWerk Android migration
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: trackwerk-website
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore reviewed public documentation changes
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,hashlib,json,os,zlib
          data=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='5b3458f386fcbd9cb6554721fb1f3c736cd8d99eb5522f18d12e7027a812e8d4'
          root=Path(os.environ['RUNNER_TEMP'])/'trackwerk-doc-refinement';root.mkdir()
          for name,text in json.loads(data).items():
              assert '/' not in name and name.endswith(('.py','.json'))
              (root/name).write_text(text)
          PYTHON
      - name: Correct only website and outer installation guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/trackwerk-doc-refinement/publish_doc_refinement.py"
      - name: Commit precise public documentation
        run: |
          git config user.name "Kid Bunka"
          git config user.email "338288444+kidbee85-beep@users.noreply.github.com"
          git add docs/site README.md PUBLICATION-MANIFEST.json TRACKWERK-URL-MIGRATION-RECEIPT.json
          git commit -m "Clarify public Android migration and independent beta identity"
          git push origin HEAD:main
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site
      - name: Publish clarified public guide
        id: deployment
        uses: actions/deploy-pages@v5.0.1
