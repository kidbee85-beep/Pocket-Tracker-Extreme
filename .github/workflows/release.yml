name: Unsigned maintainer release build

# This workflow does not publish a release or have repository-write permission.
# The stable private Android key remains outside GitHub. Sign/test/review locally
# and follow docs/RELEASING.md before any public publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Locate the application source
        id: app_source
        run: |
          if test -f source/gradlew; then echo "directory=source" >> "$GITHUB_OUTPUT"; else echo "directory=." >> "$GITHUB_OUTPUT"; fi
      - name: Build unsigned release only
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=3
      - name: Verify packaged ABI and notices
        working-directory: ${{ steps.app_source.outputs.directory }}
        run: python3 tools/release/check_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-android-maintainer-artifact-sign-before-distribution
          path: ${{ steps.app_source.outputs.directory }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
