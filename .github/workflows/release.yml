name: Unsigned maintainer release build

# This workflow does not publish a release or have repository-write permission.
# The stable private Android key remains outside GitHub. Sign/test/review locally
# and follow docs/RELEASING.md before any public publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build unsigned release only
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=3
      - name: Verify packaged ABI and notices
        run: python3 tools/release/check_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-android-maintainer-artifact-sign-before-distribution
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
